site_name: Karol Bierko - Portfolio
site_author: Karol Bierko
site_description: >-
    Portfolio moich projektów z Data Science, Machine Learning i AI.

theme:
  name: material
  user_color_mode_toggle: true
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Strona domowa: index.md
  - Moje projekty:
      - Obecny projekt:
        - "MyGPT cloud": mygpt_cloud/index.md
      - Poprzednie projekty:
        - "Audio Notes": audio_notes/index.md
        - "Find Friends": find_friends/index.md
        - "Halfmarathon": halfmarathon/index.md
        - "MyGPT local": mygpt_local/index.md


markdown_extensions:
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg